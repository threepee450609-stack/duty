# Pings the Duty Manager app on Render's free plan so it doesn't fall asleep
# (free services sleep after 15 minutes without visitors). Runs every 10 minutes, 06:00-03:00 Bangkok.
name: keep-awake
on:
  schedule:
    - cron: "*/10 23,0-19 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 -o /dev/null -w "%{http_code}\n" https://duty-manager-l4fu.onrender.com/api/meta || true
